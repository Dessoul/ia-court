# ---------------------------------------------------------------------------
# Confidentiality and publication (four-tier model)
# ---------------------------------------------------------------------------
# Tier 1 - Private notes (judge_N_private/, clerk_private/):
#   → During proceedings: author only
#   → After proceedings: Ministry of Justice (audit trail, process improvement)
#   → Never shared with parties
#
# Tier 2 - Deliberation (judges/RN/JN.deliberation.md, clerk/RN.minutes.md, clerk/RN.draft_order.md):
#   → During proceedings: judges + Clerk only
#   → After proceedings: Ministry of Justice (audit trail)
#   → Never shared with parties
#
# Tier 3 - Case file (filings, submissions, evidence, clerk questions/law_pack):
#   → During proceedings: parties + judges + Clerk
#   → After proceedings: case participants + Ministry of Justice (contains private data)
#
# Tier 4 - Verdict (decision/final.md, decision/dissent.*.md, decision/decision.yml):
#   → After proceedings: public (anonymized → jurisprudence)
confidentiality:
  publish_verdict: true            # decision/ folder → public (anonymized)
  ministry_audit_access: true      # Ministry always has access to all tiers
  redaction_policy: "none"         # none | minimal | strict (for verdict anonymization)

# ---------------------------------------------------------------------------
# Human reviewer (optional safety backstop)
# ---------------------------------------------------------------------------
human_reviewer:
  enabled: true
  notes: "PoC — all decisions reviewed by human before any real-world effect"
