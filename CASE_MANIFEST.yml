# =============================================================================
# CASE MANIFEST — Fill this out when creating a new case
# =============================================================================
# This file locks the configuration of the run for full reproducibility.
# Every case repo must have this file filled out before Round 0 begins.

case_id: "CASE-0001"
jurisdiction: "Free Republic of Liberland"
scope: "civil_small_claims"
created_utc: "2026-02-15T00:00:00Z"

# ---------------------------------------------------------------------------
# Case description (brief, neutral)
# ---------------------------------------------------------------------------
title: "FreeBuild s.r.o. v. DanuTech d.o.o. — Software delivery dispute"
summary: >
  FreeBuild s.r.o. (Applicant) contracted with DanuTech d.o.o. (Defendant) to
  develop a blockchain-based Land Registry Module for 50,000 LLM in three
  milestones. The first two milestones were delivered, accepted, and paid
  (30,000 LLM). The third milestone was delivered 6 weeks late and rejected by
  the Defendant, who cited critical deficiencies including missing features.
  The Applicant contends the rejected features were never in scope and seeks
  payment of the 20,000 LLM balance plus damages for IP infringement. The
  Defendant counterclaims for 16,500 LLM in costs incurred engaging a third-party
  developer to fix defects and complete the Module, plus delay damages. Key
  issues include whether informal email discussions modified the contract scope,
  whether the Applicant substantially performed, and whether the Defendant's
  self-help was reasonable.

# ---------------------------------------------------------------------------
# Procedural parameters
# ---------------------------------------------------------------------------
parameters:
  panel_size: 3
  decision_rule: "majority_2_of_3"
  max_rounds: 5
  max_md_chars: 25000            # max characters per .md submission
  max_new_evidence_per_round: 10
  accepted_evidence_types:
    - ".pdf"
    - ".png"
    - ".jpg"
    - ".txt"
    - ".md"
    - ".csv"
    - ".json"
  # Note: publish_private_notes has been removed. Private notes and
  # deliberations are always accessible to the Ministry of Justice for
  # audit trail and process improvement (see confidentiality section below).

