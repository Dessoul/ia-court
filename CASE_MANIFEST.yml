    notes: ""

# ---------------------------------------------------------------------------
# Law snapshot references
# ---------------------------------------------------------------------------
# These must match what is cloned in law_sources/ and recorded in
# law_sources/manifest.yml. For PoC we use "latest" at time of setup.
law_snapshot:
  constitution_repo: "https://github.com/liberland/constitution"
  constitution_branch: "master"
  constitution_ref: "TODO — Clerk fills at Round 0"
  laws_repo: "https://github.com/liberland/laws"
  laws_branch: "Laws-Current"
  laws_ref: "TODO — Clerk fills at Round 0"
  regulations_repo: "https://github.com/liberland/Regulations"
  regulations_branch: "main"
  regulations_ref: "TODO — Clerk fills at Round 0"

# ---------------------------------------------------------------------------
# Confidentiality and publication
# ---------------------------------------------------------------------------
confidentiality:
  publish_repo_after_final: true
  redaction_policy: "none"       # none | minimal | strict

# ---------------------------------------------------------------------------
# Human reviewer (optional safety backstop)
# ---------------------------------------------------------------------------
human_reviewer:
  enabled: true
  notes: "PoC — all decisions reviewed by human before any real-world effect"
